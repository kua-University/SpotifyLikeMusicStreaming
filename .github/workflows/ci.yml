name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run syntax checks
        run: npm run check

      - name: Run smoke tests
        run: npm run smoke

      - name: Build Docker image
        run: docker build -t merkeb-music:${{ github.sha }} .
