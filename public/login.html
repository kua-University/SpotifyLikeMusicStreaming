<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Spotify-Like Prototype</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-card">
        <p class="eyebrow">Prototype Access</p>
        <h1>Welcome back</h1>
        <p class="summary">
          Sign in to open the Ethiopian music home page, playlists, favorites, and recommendations.
        </p>

        <div class="demo-box">
          <strong>Demo account</strong>
          <span>Username: <code>merkeb</code></span>
          <span>Password: <code>1234</code></span>
        </div>

        <form id="loginForm" class="playlist-form">
          <input id="username" name="username" type="text" placeholder="Username" required>
          <input id="password" name="password" type="password" placeholder="Password" required>
          <button type="submit">Sign In</button>
        </form>

        <p id="loginStatus" class="status">Use the demo account above to continue.</p>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
  </html>
