apiVersion: apps/v1
kind: Deployment
metadata:
  name: merkeb-music
  namespace: merkeb-music
  labels:
    app: merkeb-music
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merkeb-music
  template:
    metadata:
      labels:
        app: merkeb-music
    spec:
      containers:
        - name: web
          image: ghcr.io/your-github-username/merkeb-music:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: merkeb-music-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
